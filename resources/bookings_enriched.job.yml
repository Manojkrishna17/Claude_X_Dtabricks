resources:
  jobs:
    bookings_enriched_job:
      name: bookings_enriched_job
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: incremental_load_bookings_enriched
          environment_key: default
          spark_python_task:
            python_file: ../src/incremental_load_bookings_enriched.py
            parameters:
              - ${var.catalog}
              - ${var.raw_schema}
              - ${var.enr_schema}
        - task_key: check_bookings_enriched_quality
          depends_on:
            - task_key: incremental_load_bookings_enriched
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters:
              - ${workspace.file_path}/src/sql/check_bookings_enriched_quality.sql
              - ${var.catalog}
              - ${var.raw_schema}
              - ${var.enr_schema}
              - ${var.cur_schema}
        - task_key: create_bookings_per_city_view
          depends_on:
            - task_key: check_bookings_enriched_quality
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters:
              - ${workspace.file_path}/src/sql/create_bookings_per_city_view.sql
              - ${var.catalog}
              - ${var.raw_schema}
              - ${var.enr_schema}
              - ${var.cur_schema}
        - task_key: create_revenue_per_city_view
          depends_on:
            - task_key: check_bookings_enriched_quality
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters:
              - ${workspace.file_path}/src/sql/create_revenue_per_city_view.sql
              - ${var.catalog}
              - ${var.raw_schema}
              - ${var.enr_schema}
              - ${var.cur_schema}
        - task_key: create_bookings_per_month_view
          depends_on:
            - task_key: check_bookings_enriched_quality
          environment_key: default
          spark_python_task:
            python_file: ../src/run_sql.py
            parameters:
              - ${workspace.file_path}/src/sql/create_bookings_per_month_view.sql
              - ${var.catalog}
              - ${var.raw_schema}
              - ${var.enr_schema}
              - ${var.cur_schema}
